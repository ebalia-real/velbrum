
/** ------------------------------
 * [CATEGORY] VELBRUM
 * Lo que Mullvad Browser hace y LibreWolf no, agregado al final de la
 * configuración de LibreWolf (ver velbrum/README.md). defaultPref = valor inicial
 * que se puede cambiar en about:config o en user.js del perfil; lockPref = fijo.
 * ------------------------------- */

/** [SECTION] HUELLA DIGITAL
 * Letterboxing: el área de la página se redondea a tamaños comunes (bordes
 * grises), así el tamaño de la ventana no te distingue. Páginas en inglés:
 * navigator.language y Accept-Language dicen en-US como en todos los usuarios
 * de Mullvad/Tor; la interfaz del navegador sigue en español. Las fuentes son
 * las de Mullvad Browser (las pone el lanzador con FONTCONFIG_FILE).
 */
// Se saca y se pone desde el botón «Velbrum» (marca/ajustes-velbrum.sys.mjs) o con
// «velbrum --sin-bordes»/«--con-bordes»: el lanzador lo pone en user.js.
defaultPref("privacy.resistFingerprinting.letterboxing", true);
defaultPref("privacy.spoof_english", 2);
// Firefox solo aplica spoof_english cuando la preferencia cambia (RFPHelper),
// no cuando viene por defecto: se aplica acá en cada arranque. Para ver las
// páginas en español, poné privacy.spoof_english en 1 en about:config.
if (getPref("privacy.spoof_english") == 2) {
  pref("intl.accept_languages", "en-US, en");
  pref("javascript.use_us_english_locale", true);
}

/** [SECTION] DNS CIFRADO (DoH)
 * Modo 3 = solo DoH, sin volver al DNS del sistema si falla. Quad9 bloquea
 * dominios de malware y no manda tu subred (ECS); reemplaza a Safe Browsing de
 * Google, que LibreWolf apaga. Los dominios de la red local (y los que se
 * agreguen con la opción velbrum.dominiosLocales, por ejemplo los de una VPN)
 * van por el DNS del sistema, porque Quad9 no los conoce: los pone
 * default.nix.
 */
defaultPref("network.trr.mode", 3);
defaultPref("network.trr.uri", "https://dns.quad9.net/dns-query");
defaultPref("network.trr.custom_uri", "https://dns.quad9.net/dns-query");

/** [SECTION] WEBRTC
 * Solo la interfaz de la ruta por defecto y sin candidatos «host»: no se
 * exponen IPs locales ni las de una VPN, aunque des permiso de cámara.
 */
defaultPref("media.peerconnection.ice.default_address_only", true);
defaultPref("media.peerconnection.ice.no_host", true);

/** [SECTION] EXTENSIONES
 * La extensión propia de Velbrum está en la carpeta de la aplicación
 * (browser/extensions, solo lectura): se activa sola y se revisa en cada
 * arranque. Las extensiones de Chrome que Velbrum adapta a Gecko no pueden
 * llevar la firma de Mozilla, así que se aceptan extensiones sin firma, pero
 * solo con el cartel de confirmación: lo que aparezca suelto en el perfil
 * (o en ~/.mozilla/extensions o carpetas del sistema) queda desactivado hasta
 * que lo apruebes (autoDisableScopes = perfil + usuario + sistema), y el
 * perfil ni se revisa al arrancar (startupScanScopes = solo la aplicación).
 */
lockPref("extensions.autoDisableScopes", 11);
lockPref("extensions.startupScanScopes", 4);
// El fondo de las extensiones no se suspende al rato sin uso: las de Chrome
// cuentan con mensajes y conexiones (WebSocket, puertos) que Chrome mantiene
// vivos, y sin esto billeteras y gestores de contraseñas se cortan solos.
defaultPref("extensions.background.idle.enabled", false);
defaultPref("xpinstall.signatures.required", false);

/** [SECTION] SIN SERVIDORES DE LIBREWOLF
 * LibreWolf le indica a uBlock Origin que baje su configuración inicial de
 * librewolf.dev. Vacío: uBlock Origin usa sus propias fuentes (GitHub y sus
 * espejos), como en cualquier Firefox.
 */
defaultPref("librewolf.uBO.assetsBootstrapLocation", "");

/** [SECTION] IDIOMA Y MARCA
 * El paquete de idioma con la marca «Velbrum» lo prepara el servicio de sistema
 * velbrum-idioma en /var/lib/velbrum/idioma (solo root lo puede modificar) y lo
 * instala una política del navegador (default.nix). No lleva la firma de
 * Mozilla porque se le cambió la marca.
 */
defaultPref("extensions.langpacks.signatures.required", false);
// Interfaz en el idioma del sistema.
defaultPref("intl.locale.requested", "");

/** [SECTION] COMO MULLVAD BROWSER
 * Lo que Mullvad Browser 15 cambia (000-mullvad-browser.js y
 * 001-base-profile.js) y LibreWolf no trae. Quedan afuera los de su marca y
 * su VPN, y los que bajan la seguridad: Mullvad apaga la protección contra
 * rastreo de Firefox y la revocación de certificados (CRLite) porque se apoya
 * en otras cosas; Velbrum las mantiene. Las fuentes por idioma de Mullvad las
 * agrega default.nix (fuentes-mullvad.cfg, sacado de su paquete).
 */
// Aislamiento por sitio: cookies, caché, conexiones y almacenamiento quedan
// separados por el sitio que estás visitando (protección total de cookies y
// partición de red de Firefox, que LibreWolf ya trae). Mullvad suma además el
// aislamiento «first-party» viejo, que separa lo mismo pero rompe extensiones
// (su API de cookies falla si no saben de él, y las convertidas de Chrome no
// saben) e inicios de sesión entre dominios; acá queda solo en la ventana con
// Tor, como en Tor Browser.
defaultPref("privacy.firstparty.isolate", false);
// Funciones que Mullvad borra de la página: Velbrum las deja existir pero sin
// que revelen nada, porque muchos sitios dan por hecho que están y se caen
// enteros si faltan («this page couldn't load»), como metamask.io sin
// WebGL2RenderingContext. Firefox normal las tiene todas, así que tenerlas
// tampoco te distingue.
// - Ubicación: navigator.geolocation existe, pero no hay de dónde sacarla (ni
//   servicio de red ni GeoClue ni GPS): el sitio pide permiso y recibe «no
//   disponible».
// - Llaves de acceso (passkeys) y navigator.credentials: los usan los inicios
//   de sesión de Google, Microsoft y otros. Solo funcionan si vos las usás.
// - Service workers: sin ellos no andan WhatsApp Web y otras aplicaciones web.
//   Se borran al cerrar, con el resto de los datos de los sitios. Las
//   notificaciones push siguen apagadas (pasan por un servidor de Mozilla).
// - SharedArrayBuffer solo en sitios aislados (COOP/COEP), como en Firefox: lo
//   necesitan Zoom y los editores de video web. Las defensas contra Spectre
//   quedan prendidas también en esos sitios.
// - WebGL 2, que igual pide permiso en cada sitio.
// La ventana con Tor las apaga todas, como Tor Browser.
defaultPref("geo.enabled", true);
defaultPref("geo.provider.network.url", "");
defaultPref("geo.provider.use_geoclue", false);
defaultPref("geo.provider.use_gpsd", false);
defaultPref("security.webauth.webauthn", true);
defaultPref("dom.serviceWorkers.enabled", true);
defaultPref("dom.push.enabled", false);
defaultPref("dom.push.serverURL", "");
defaultPref("dom.webmidi.enabled", false);
defaultPref("dom.postMessage.sharedArrayBuffer.withCOOP_COEP", true);
defaultPref("javascript.options.spectre.disable_for_isolated_content", false);
defaultPref("dom.text-recognition.enabled", false);
defaultPref("captchadetection.actor.enabled", false);
defaultPref("dom.use_components_shim", false);
// WebRTC: Mullvad lo manda solo por servidores intermedios (TURN) para no
// mostrar la IP de su VPN; así no conectan las llamadas de Discord, WhatsApp
// Web y otras que no tienen esos servidores. Acá queda como en Firefox, sin
// mostrar IPs locales (sección WEBRTC): la otra punta de una llamada ve la
// misma IP pública que ya ve cualquier sitio.
// Huella: el almacenamiento disponible es fijo (no dice el tamaño del disco),
// sin colores ni acento del sistema, sin rebote al desplazar, y sin
// identificadores de sesión TLS que permitan reconocerte entre visitas.
defaultPref("dom.quotaManager.temporaryStorage.fixedLimit", 52428800);
defaultPref("browser.display.use_system_colors", false);
defaultPref("widget.non-native-theme.use-theme-accent", false);
defaultPref("apz.overscroll.enabled", false);
// (Mullvad también apaga widget.wayland.vsync.enabled; en Wayland eso deja
// trabado el desplazamiento con la rueda y la barra, así que queda como en
// Firefox.)
defaultPref("security.ssl.disable_session_identifiers", true);
// Un proxy (la ventana con Tor, una VPN) no se puede saltear: ni las
// extensiones ni una caída del proxy hacen que se conecte directo.
lockPref("network.proxy.allow_bypass", false);
lockPref("network.proxy.failover_direct", false);
// Sin conexiones solas a Mozilla: plugins de video (Widevine/OpenH264),
// datos de complementos, la portada y ajustes remotos de la protección contra
// huella. (Las traducciones quedan: traducen en la PC y solo bajan el modelo
// del idioma cuando las usás.)
defaultPref("media.gmp-provider.enabled", false);
defaultPref("media.gmp-manager.url.override", "data:text/plain,");
defaultPref("media.gmp-widevinecdm.visible", false);
defaultPref("privacy.fingerprintingProtection.remoteOverrides.enabled", false);
defaultPref("media.hevc.enabled", false);
defaultPref("extensions.getAddons.cache.enabled", false);
defaultPref("extensions.abuseReport.enabled", false);
defaultPref("browser.newtabpage.activity-stream.discoverystream.enabled", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.useRemoteL10n", false);
defaultPref("dom.prefetch_dns_for_anchor_http_document", false);
defaultPref("signon.recipes.remoteRecipes.enabled", false);
defaultPref("signon.management.page.breach-alerts.enabled", false);
defaultPref("signon.formlessCapture.enabled", false);
defaultPref("signon.firefoxRelay.feature", "disabled");
// Certificados del sistema: Mullvad no los carga porque identifican el equipo.
defaultPref("security.osclientcerts.autoload", false);
// Programas externos (correo, noticias): siempre preguntar antes de abrirlos.
defaultPref("network.protocol-handler.external-default", false);
defaultPref("network.protocol-handler.external.mailto", false);
defaultPref("network.protocol-handler.warn-external.mailto", true);
defaultPref("network.protocol-handler.external.news", false);
defaultPref("network.protocol-handler.external.nntp", false);
defaultPref("network.protocol-handler.external.snews", false);
defaultPref("network.protocol-handler.warn-external.news", true);
defaultPref("network.protocol-handler.warn-external.nntp", true);
defaultPref("network.protocol-handler.warn-external.snews", true);
// Descargas: preguntar con los tipos nuevos y frenar descargas en cadena.
defaultPref("browser.download.always_ask_before_handling_new_types", true);
defaultPref("browser.download.enable_spam_prevention", true);
// La dirección completa (con https://) y sin sugerencias de sitios
// frecuentes ni búsquedas recientes en la barra.
defaultPref("browser.urlbar.trimURLs", false);
defaultPref("browser.urlbar.suggest.topsites", false);
defaultPref("browser.urlbar.suggest.recentsearches", false);
defaultPref("dom.security.https_only_mode_pbm", true);
defaultPref("dom.security.https_first_add_exception_on_failure", false);
// Sin copias de seguridad del perfil en otra carpeta.
defaultPref("browser.backup.enabled", false);

/** [SECTION] SIEMPRE PRIVADO
 * LibreWolf pone browser.privatebrowsing.autostart en false en cada arranque
 * (pref): la casilla «Siempre privado» del botón la deja anotada y el lanzador
 * pasa VELBRUM_SIEMPRE_PRIVADO=1, que acá vuelve a ponerla.
 */
if (getenv("VELBRUM_SIEMPRE_PRIVADO") == "1") {
  pref("browser.privatebrowsing.autostart", true);
}

/** [SECTION] VENTANA PRIVADA CON TOR
 * Solo en «velbrum --tor» (el lanzador pone VELBRUM_TOR=1 y arranca su propio Tor,
 * con un socket que solo tu usuario puede usar). Todo va por Tor y nada se
 * puede cambiar: sin DNS propio, sin WebRTC ni HTTP/3 (UDP no pasa por Tor),
 * siempre privado, sin la extensión de las tiendas de Chrome (su conversor no
 * pasa por Tor) y sin instalar extensiones. Cada sitio usa su propio circuito
 * de Tor (marca/ajustes-velbrum.sys.mjs).
 */
if (getenv("VELBRUM_TOR") == "1") {
  lockPref("network.proxy.type", 1);
  lockPref("network.proxy.socks", "file://" + getenv("VELBRUM_TOR_SOCKET"));
  lockPref("network.proxy.socks_port", 0);
  lockPref("network.proxy.socks_version", 5);
  lockPref("network.proxy.socks_remote_dns", true);
  lockPref("network.proxy.http", "");
  lockPref("network.proxy.ssl", "");
  lockPref("network.proxy.no_proxies_on", "");
  lockPref("network.proxy.allow_hijacking_localhost", true);
  lockPref("network.dns.disabled", true);
  lockPref("network.trr.mode", 5);
  lockPref("network.http.http3.enable", false);
  lockPref("media.peerconnection.enabled", false);
  lockPref("browser.privatebrowsing.autostart", true);
  lockPref("privacy.firstparty.isolate", true);
  lockPref("geo.enabled", false);
  lockPref("security.webauth.webauthn", false);
  lockPref("dom.serviceWorkers.enabled", false);
  lockPref("dom.postMessage.sharedArrayBuffer.withCOOP_COEP", false);
  lockPref("privacy.resistFingerprinting.letterboxing", true);
  lockPref("network.captive-portal-service.enabled", false);
  lockPref("network.connectivity-service.enabled", false);
  lockPref("extensions.enabledScopes", 1);
  lockPref("xpinstall.enabled", false);
  // Los sitios .onion: contexto seguro aunque sean http, sin pasar a https
  // a la fuerza y sin mandar el origen .onion a otros sitios.
  lockPref("dom.securecontext.allowlist_onions", true);
  lockPref("dom.security.https_only_mode.upgrade_onion", false);
  lockPref("network.http.referer.hideOnionSource", true);
  defaultPref("browser.startup.homepage", "https://check.torproject.org/");
  defaultPref("velbrum.tor", true);
}
