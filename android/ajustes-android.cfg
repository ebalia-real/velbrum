
/** ------------------------------
 * [CATEGORY] VELBRUM PARA ANDROID
 * Va después de gecko/ajustes.cfg (los mismos ajustes que en la PC), al
 * final de la configuración de IronFox (ironfox.cfg). Lo de acá es lo que
 * cambia en Android. Los ajustes que IronFox maneja desde su pantalla de
 * Ajustes (modo de DoH, páginas en inglés, instalar complementos…) los fija
 * esa pantalla al arrancar y la configuración no los puede cambiar (en el
 * registro: «GeckoSettingsBridge: Blocked attempt to set pref»).
 * ------------------------------- */

/** [SECTION] HUELLA DIGITAL
 * Como en la PC (y en Tor Browser para Android): resistFingerprinting. IronFox
 * usa en su lugar la protección contra huella de Firefox con su lista de
 * excepciones; con resistFingerprinting todos los usuarios de Velbrum se ven
 * iguales (zona horaria UTC, pantalla redondeada, idioma en inglés…).
 */
defaultPref("privacy.resistFingerprinting", true);
defaultPref("privacy.resistFingerprinting.pbmode", true);

/** [SECTION] DNS CIFRADO (DoH)
 * Quad9, como en la PC. IronFox trae Mullvad: el proveedor de la pantalla
 * «DNS sobre HTTPS» sale de default_provider_uri. Quad9 se resuelve sin el
 * DNS del sistema (bootstrapAddr), como IronFox hace con los suyos.
 */
defaultPref("network.trr.default_provider_uri", "https://dns.quad9.net/dns-query");
if (getPref("network.trr.uri") == "https://dns.quad9.net/dns-query" || getPref("network.trr.uri") == "") {
  lockPref("network.trr.bootstrapAddr", "9.9.9.9");
}

/** [SECTION] EXTENSIONES
 * Como en Firefox de escritorio (y Velbrum en la PC): los sitios que pide una
 * extensión Manifest V3 aparecen en el cartel de instalación y se conceden
 * al aceptarlo. IronFox no los concede (hay que darlos uno por uno en los
 * ajustes de la extensión), y las convertidas de Chrome no andaban hasta
 * entonces.
 */
defaultPref("extensions.originControls.grantByDefault", true);
